# QV FITS on the DigitalOcean Droplet (docs/06-deployment.md).
#
# Serves the built site from /var/www/qvfits/dist and proxies /api to
# qvfits-api under PM2 on port 5000, so the site calls a relative /api in
# every environment. certbot adds the SSL server blocks on first run:
#   sudo certbot --nginx -d qvfits.com -d www.qvfits.com

# www goes to the bare domain (replaces public/_redirects, which is Netlify-only).
server {
    listen 80;
    server_name www.qvfits.com;
    return 301 https://qvfits.com$request_uri;
}

server {
    listen 80;
    server_name qvfits.com;

    root /var/www/qvfits/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API: same origin, no CORS.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;   # product photo uploads
    }

    # Live updates over WebSocket (Socket.IO). The client connects with WebSocket only,
    # so it works across PM2 processes without sticky sessions.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A quiet socket stays open; Socket.IO pings every 25 seconds.
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Photos and logos change rarely; a week, revalidated.
    location ~* ^/(photos|logo|icons)/ {
        expires 7d;
        try_files $uri =404;
    }

    # index.html is never cached, so a deploy shows at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: React Router handles every other path.
    location / {
        try_files $uri /index.html;
    }
}
