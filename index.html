    <!-- Open Graph / social sharing. Each page sets its own in the browser (src/seo/useSeo.js),
         and scripts/seo-prerender.mjs writes the same tags into every product and shop page at build,
         because WhatsApp, Facebook and X read this file before any script runs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="QVFITS" />
    <meta property="og:title" content="QVFITS | Activewear, Swim &amp; Lounge, Kampala" />
    <meta property="og:description" content="Premium seamless and seam-fit activewear, swim and lounge wear. Showroom at THE CUBE, Kisementi, Kampala. Delivery across Uganda." />
    <meta property="og:url" content="https://qvfits.com/" />
    <meta property="og:image" content="https://qvfits.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="QVFITS: seamless activewear, swim and lounge wear, Kampala" />
    <meta property="og:locale" content="en_UG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="QVFITS | Activewear, Swim &amp; Lounge, Kampala" />
    <meta name="twitter:description" content="Premium seamless and seam-fit activewear, swim and lounge wear. Showroom at THE CUBE, Kisementi, Kampala. Delivery across Uganda." />
    <meta name="twitter:image" content="https://qvfits.com/og-image.png" />
    <meta name="twitter:image:alt" content="QVFITS: seamless activewear, swim and lounge wear, Kampala" />

    <!-- Structured data: the shop, and the site's search box -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ClothingStore",
            "@id": "https://qvfits.com/#store",
            "name": "QVFITS",
            "alternateName": "Quivogue",
            "url": "https://qvfits.com/",
            "logo": "https://qvfits.com/logo/qvfits-icon.png",
            "image": "https://qvfits.com/og-image.png",
            "description": "Premium seamless and seam-fit activewear, swim and lounge wear from Kampala.",
            "telephone": "+256758981959",
            "email": "qvfits@gmail.com",
            "foundingDate": "2023",
            "currenciesAccepted": "UGX",
            "priceRange": "UGX",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "THE CUBE, G17, Kisementi",
              "addressLocality": "Kampala",
              "addressCountry": "UG"
            },
            "sameAs": ["https://www.instagram.com/quivogue", "https://www.tiktok.com/@quivoguefits"]
          },
          {
            "@type": "WebSite",
            "@id": "https://qvfits.com/#website",
            "url": "https://qvfits.com/",
            "name": "QVFITS",
            "publisher": { "@id": "https://qvfits.com/#store" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://qvfits.com/shop?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Type: Bodoni Moda (display), Geist (text), Anton (the logo's QVFITS name), from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link rel="stylesheet" href="/_pf/fonts.css" data-preview-only />
